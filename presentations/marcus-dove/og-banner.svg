<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="glowOrange" cx="0.2" cy="0.25" r="0.5">
      <stop offset="0%" stop-color="#F38330" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F38330" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.85" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#0057E1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0057E1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F38330" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F38330" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F38330" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep warm ink base -->
  <rect width="1200" height="630" fill="#0a0d12"/>

  <!-- Ambient glows -->
  <ellipse cx="240" cy="160" rx="500" ry="350" fill="url(#glowOrange)"/>
  <ellipse cx="1020" cy="535" rx="450" ry="320" fill="url(#glowBlue)"/>

  <!-- Top eyebrow line + mono caption -->
  <line x1="420" y1="160" x2="780" y2="160" stroke="url(#accentLine)" stroke-width="2"/>
  <text x="600" y="138" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" font-weight="500" letter-spacing="6" fill="#F38330">
    PERFORMANCE MINDSET COACH
  </text>

  <!-- Marcus Dove wordmark -->
  <text x="600" y="320" text-anchor="middle" font-family="'Bebas Neue', 'Arial Black', 'Helvetica Neue', sans-serif" font-size="138" font-weight="700" letter-spacing="-2">
    <tspan fill="#F38330">MARCUS</tspan><tspan fill="#0057E1">DOVE</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="395" text-anchor="middle" font-family="'Manrope', 'Helvetica Neue', sans-serif" font-size="32" font-weight="400" fill="#FAF6F1" opacity="0.85">
    Standard Paid Ads Proposal
  </text>

  <!-- Bottom divider -->
  <line x1="500" y1="490" x2="700" y2="490" stroke="#F38330" stroke-width="1" opacity="0.5"/>

  <!-- Arc Garde signature -->
  <text x="600" y="540" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="16" font-weight="500" letter-spacing="6" fill="#FAF6F1" opacity="0.55">
    PRESENTATION BY ARC GARDE
  </text>
</svg>
