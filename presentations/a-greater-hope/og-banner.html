<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG banner source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700&family=Fira+Sans+Condensed:wght@600;800&display=swap">
<style>
  /* Render source for og-banner.png, 1200x630. Same design layer as the
     deck: white paper, the brand sweep as the top edge, Fira Sans
     Condensed caps, the darkened ink sweep on the org name. */
  * { margin: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; }

  body {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    background: #fffcf7;
    font-family: 'Fira Sans', system-ui, sans-serif;
    overflow: hidden;
  }

  .sweep {
    position: absolute;
    inset: 0 0 auto 0;
    height: 10px;
    background: linear-gradient(90deg, #6e2877 0%, #0076bb 28%, #34998a 46%, #7fbc42 62%, #f5a578 84%, #ff5757 100%);
  }

  /* Same four washes as the deck hero, so the unfurl and the page match. */
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(58% 52% at 16% 22%, rgba(142, 237, 217, 0.40) 0%, rgba(142, 237, 217, 0) 70%),
      radial-gradient(52% 48% at 86% 16%, rgba(167, 199, 240, 0.36) 0%, rgba(167, 199, 240, 0) 70%),
      radial-gradient(56% 52% at 82% 88%, rgba(245, 165, 120, 0.30) 0%, rgba(245, 165, 120, 0) 72%),
      radial-gradient(50% 46% at 10% 86%, rgba(200, 160, 220, 0.28) 0%, rgba(200, 160, 220, 0) 72%);
  }

  .ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 640px;
    height: 640px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: linear-gradient(90deg, #6e2877, #0076bb, #34998a, #7fbc42, #f5a578, #ff5757);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
    opacity: 0.22;
  }

  .inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 26px; }

  img { width: 108px; height: 108px; display: block; }

  h1 {
    font-family: 'Fira Sans Condensed', sans-serif;
    font-weight: 800;
    font-size: 82px;
    line-height: 0.96;
    letter-spacing: 0.008em;
    text-transform: uppercase;
    text-align: center;
    color: #241d2b;
    white-space: nowrap;
  }

  h1 .grad {
    display: block;
    background: linear-gradient(90deg, #6e2877 0%, #37509a 50%, #0f7a6c 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .rule { width: 104px; height: 4px; border-radius: 999px; background: linear-gradient(90deg, #6e2877, #0076bb, #34998a, #7fbc42, #f5a578, #ff5757); }

  .foot {
    font-family: 'Fira Sans Condensed', sans-serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #6a5f74;
  }
</style>
</head>
<body>
  <div class="sweep"></div>
  <div class="glow"></div>
  <div class="ring"></div>
  <div class="inner">
    <img src="agh-logo-256.webp" alt="">
    <h1>
      Paid Media For
      <span class="grad">A Greater Hope</span>
    </h1>
    <div class="rule"></div>
    <p class="foot">Presented by Arc Garde</p>
  </div>
</body>
</html>
