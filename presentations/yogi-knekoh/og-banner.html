<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AG Presentation OG banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@600;700&display=swap">
<style>
  /* AG house banner. Same system as assets/og-banner.png and assets/og-hub.png:
     near-black ground, a gold hairline top and bottom, the serif AG monogram
     carrying a warm metal gradient with a soft halo behind it, a small gold
     diamond, then the label in the bold sans. Only the label changes. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0a0a0a; }
  .card {
    width: 1200px; height: 630px; position: relative;
    background: #0a0a0a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  /* the halo the monogram sits in */
  .card::before {
    content: ""; position: absolute; left: 50%; top: 46%;
    width: 620px; height: 420px; transform: translate(-50%, -50%);
    background: radial-gradient(52% 50% at 50% 50%, rgba(201,168,97,0.10) 0%, rgba(201,168,97,0.03) 46%, rgba(0,0,0,0) 72%);
    filter: blur(8px);
  }
  .rule {
    position: absolute; left: 200px; right: 200px; height: 1px;
    background: linear-gradient(90deg, rgba(201,168,97,0) 0%, rgba(201,168,97,0.85) 50%, rgba(201,168,97,0) 100%);
  }
  .rule.top { top: 60px; }
  .rule.bot { bottom: 60px; }
  .mono {
    position: relative; z-index: 1;
    font-family: 'Cinzel', Georgia, serif; font-weight: 600;
    font-size: 172px; line-height: 1; letter-spacing: 0.02em; padding-left: 0.02em;
    background: linear-gradient(100deg, #b9965a 0%, #e3c489 22%, #fffdf6 48%, #ffffff 54%, #e3c489 76%, #b9965a 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 0 34px rgba(255,251,240,0.30));
  }
  .diamond {
    position: relative; z-index: 1;
    width: 10px; height: 10px; background: #c9a861;
    transform: rotate(45deg); margin-top: 46px;
  }
  .label {
    position: relative; z-index: 1; margin-top: 40px;
    font-family: 'Inter', system-ui, sans-serif; font-weight: 700;
    font-size: 50px; line-height: 1; letter-spacing: -0.01em; color: #f7f5f0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="rule top"></div>
    <div class="mono">AG</div>
    <div class="diamond"></div>
    <div class="label">Presentation</div>
    <div class="rule bot"></div>
  </div>
</body>
</html>
