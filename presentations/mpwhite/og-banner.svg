<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a861" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a861" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c9a861" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="280" y="282" width="640" height="2" fill="url(#line)" filter="url(#glow)"/>
  <text x="600" y="370" font-family="'Impact', 'Arial Narrow', 'Helvetica Neue', sans-serif" font-size="78" font-weight="900" fill="#fafafa" text-anchor="middle" letter-spacing="10">GROWTH PARTNERS</text>
  <text x="600" y="425" font-family="'Arial', sans-serif" font-size="18" font-weight="700" fill="#c9a861" text-anchor="middle" letter-spacing="7">GROWTH PROPOSAL</text>
</svg>
