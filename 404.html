<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Page not found</title>
<!--
  Arc Garde hub - static not-found page.

  Vercel serves this for any path the middleware matcher does NOT cover, which is
  the genuine "this does not exist" case: a typo, a stale external link, a crawler.
  Before this file those requests fell through to Vercel's stock NOT_FOUND screen.

  It is DELIBERATELY a different message from the gated page in middleware.js.
  The split is by NAMESPACE, never by whether a deck exists:

    /presentations/* /reports/* /preview/* /arborwealth* /hitch-academy*
      -> middleware returns one identical "not available" page for a real locked
         deck AND an invented slug, so the client list cannot be enumerated.
    everything else
      -> this page. Nothing private is addressable here, so naming it leaks nothing.

  Chrome is copied verbatim from branded404() in middleware.js so the two read as
  one system. Self-contained on purpose: no external font, script or image, so it
  renders under the strict CSP in vercel.json and cannot fail to paint.
-->
<style>
  :root { color-scheme: dark }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0d0b09;
    color: #f2ece3;
    font: 400 16px/1.6 -apple-system, Segoe UI, Roboto, sans-serif;
    text-align: center;
    padding: 2rem;
  }
  .w { max-width: 34rem }
  h1 { font-size: 1.5rem; margin: 0 0 .75rem; letter-spacing: .01em }
  p { margin: 0; color: #9a9086 }
  .b {
    width: 2.25rem;
    height: 2.25rem;
    margin: 0 auto 1.5rem;
    border: 1px solid #c9a36a;
    border-radius: 50%;
  }
</style>
</head>
<body>
  <div class="w">
    <div class="b"></div>
    <h1>Page not found</h1>
    <p>The address may be incomplete, or this page may have moved.</p>
  </div>
</body>
</html>
