/* ---- THE MARK IS THE LAMP -------------------------------------------------
   The emitter is a CHILD of the mark, so the light originates at the AG and
   travels outward. No blend mode: with exactly ONE source there is nothing for
   additive compositing to sum against, and on a near-black ground plus-lighter
   and normal are visually identical. Additive earned its cost when three lamps
   overlapped; it does not for one. */
.w{position:relative;max-width:34rem;animation:rise .9s cubic-bezier(.16,1,.3,1) backwards}
.mark{position:relative;width:96px;height:96px;margin:0 auto 1.7rem;
animation:rise .7s cubic-bezier(.16,1,.3,1) backwards}
/* ONE emitter. Three stacked shells was the bug: each ended its taper early and
   went transparent, which puts a KINK in the falloff, and lateral inhibition in
   the eye turns a kink into a visible ring. Mach banding, not colour banding:
   measured steps in the old render were ~2px and never wider than 8px, so it was
   never 8-bit quantization. This curve is a single exponential whose first
   differences decrease monotonically all the way to exactly 0 at 100%, so there
   is no kink anywhere. The hue drifts warm-white to deep brown across it as well,
   so the R, G and B iso-luminance contours land at different radii instead of
   stacking into one crisp circle. */
.mark__field{position:absolute;left:50%;top:50%;width:74vmax;height:74vmax;
transform:translate(-50%,-50%);pointer-events:none;
background:radial-gradient(circle closest-side,rgba(255,243,221,0.1860) 0.0%,rgba(236,220,195,0.1236) 6.3%,rgba(220,202,177,0.0816) 12.5%,rgba(206,187,162,0.0536) 18.8%,rgba(193,172,147,0.0349) 25.0%,rgba(179,159,134,0.0225) 31.3%,rgba(167,145,121,0.0144) 37.5%,rgba(154,133,109,0.0091) 43.8%,rgba(142,120,97,0.0056) 50.0%,rgba(131,108,86,0.0034) 56.3%,rgba(119,96,75,0.0020) 62.5%,rgba(107,84,64,0.0011) 68.8%,rgba(96,73,53,0.0006) 75.0%,rgba(85,62,43,0.0003) 81.3%,rgba(74,51,33,0.0001) 87.5%,rgba(63,40,23,0.0000) 93.8%,rgba(52,29,13,0.0000) 100.0%)}
.mark__pool{position:absolute;inset:1px;border-radius:50%;
background:radial-gradient(circle at 50% 46%,rgba(255,231,190,0.06),rgba(255,226,178,0.015) 44%,
rgba(255,226,178,0) 72%)}

   Clockwise only: no reverse, no counter-rotating element. */
