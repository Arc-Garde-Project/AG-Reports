<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0A0A0A">
<title>Hitch Academy Campaign Reports</title>
<meta name="description" content="All campaign reports for Hitch Academy by Michael Asibou. Ad testing results and performance summaries.">
<meta property="og:title" content="Hitch Academy Campaign Reports">
<meta property="og:description" content="All campaign reports for Hitch Academy by Michael Asibou. Ad testing results and performance summaries.">
<meta property="og:image" content="https://ag-reports.vercel.app/assets/hitch-academy/og-banner.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ag-reports.vercel.app/reports/hitch-academy">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Hitch Academy Campaign Reports">
<meta name="twitter:description" content="All campaign reports for Hitch Academy by Michael Asibou. Ad testing results and performance summaries.">
<meta name="twitter:image" content="https://ag-reports.vercel.app/assets/hitch-academy/og-banner.png">
<link rel="canonical" href="https://ag-reports.vercel.app/reports/hitch-academy">
<link rel="icon" type="image/png" href="/assets/hitch-academy/favicon.png">
<link rel="apple-touch-icon" href="/assets/hitch-academy/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0A0A;
  --card: #111111;
  --card-deep: #0D0D0D;
  --border: #1A1A1A;
  --red: #D72638;
  --red-lt: #E03B4D;
  --text: #E8E8F0;
  --muted: #999;
  --green: #2ECC71;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  background-image: radial-gradient(ellipse at 50% 0%, rgba(215,38,56,0.06) 0%, transparent 60%);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  padding-top: env(safe-area-inset-top);
  padding-right: env(safe-area-inset-right);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
}

.portal { max-width: 800px; margin: 0 auto; padding: 60px 24px 40px; }

/* -- Header -- */
.header { text-align: center; margin-bottom: 48px; }
.header-name {
  font-size: 28px; font-weight: 800; color: var(--text); margin-bottom: 4px;
  letter-spacing: -0.5px;
}
.header-title {
  font-size: 14px; color: var(--muted); font-weight: 400; letter-spacing: 1px;
}
.divider {
  width: 140px; height: 2px; margin: 24px auto 0; border-radius: 2px;
  background: linear-gradient(90deg, var(--red), var(--red-lt));
}

/* -- Section -- */
.section { margin-bottom: 40px; }
.section-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 3px;
  color: #555; font-weight: 700; margin-bottom: 16px; padding-left: 4px;
  display: flex; align-items: center; gap: 10px;
}
.section-label::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
}
.section-label.red::before { background: var(--red); box-shadow: 0 0 8px var(--red); }

/* -- Report Cards -- */
.reports-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.report-card {
  display: block; text-decoration: none; position: relative;
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 24px 20px; transition: all 0.3s; overflow: hidden;
  touch-action: manipulation;
}
.report-card::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--red), var(--red-lt));
  opacity: 0; transition: opacity 0.3s;
}
@media (hover: hover) {
  .report-card:hover {
    border-color: rgba(215,38,56,0.3); transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }
  .report-card:hover::after { opacity: 1; }
}
.report-card:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.report-title {
  font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px;
}
.report-date {
  font-size: 12px; color: #666; font-weight: 400;
}
.report-type {
  display: flex; align-items: center; gap: 6px; margin-top: 12px;
  font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
  color: #555; font-weight: 600;
}
.report-type-dot {
  width: 6px; height: 6px; border-radius: 50%;
}
.report-type-dot.ad-test { background: var(--red); }

/* -- Badge -- */
.badge {
  position: absolute; top: 16px; right: 16px;
  font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 4px 10px; border-radius: 12px;
  background: rgba(46,204,113,0.12); color: var(--green);
}

/* -- Footer -- */
.footer { text-align: center; padding: 32px 0 0; border-top: 1px solid var(--border); margin-top: 16px; }
.footer a {
  color: #444; font-size: 10px; letter-spacing: 3px; text-decoration: none;
  text-transform: uppercase; transition: color 0.3s; font-weight: 600;
}
.footer a:hover { color: var(--red); }

/* -- Responsive -- */
@media (max-width: 768px) {
  .portal { padding: 40px 16px 32px; }
  .header-name { font-size: 24px; }
  .report-title { font-size: 14px; }
}
@media (max-width: 480px) {
  .reports-grid { grid-template-columns: 1fr; }
  .portal { padding: 32px 12px 24px; }
  .header { margin-bottom: 32px; }
  .report-card { padding: 20px 16px; }
}

/* -- Reduced Motion -- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div class="portal">
  <div class="header">
    <div class="header-name">Hitch Academy</div>
    <div class="header-title">Campaign Reports</div>
    <div class="divider"></div>
  </div>

  <div class="section">
    <div class="section-label red">Ad Testing</div>
    <div class="reports-grid">
      <a class="report-card" href="/reports/hitch-academy/mar-3-8">
        <span class="badge">Latest</span>
        <div class="report-title">Launch Week</div>
        <div class="report-date">Mar 3 - 8, 2026</div>
        <div class="report-type"><span class="report-type-dot ad-test"></span> Ad Test</div>
      </a>
    </div>
  </div>

  <div class="footer">
    <a href="https://www.arcgarde.com" target="_blank">Arc Garde</a>
  </div>
</div>

</body>
</html>
