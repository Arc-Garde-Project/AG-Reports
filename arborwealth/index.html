<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0A1628;
  --navy2:#0D1F35;
  --cream:#F8F7F4;
  --cream-rgb:248,247,244;
  --gold:#C9A962;
  --gold-bright:#D4B86A;
  --gold-deep:#8A7340;
  --gold-rgb:201,169,98;
}
html{background:var(--navy);overflow-x:hidden;-webkit-text-size-adjust:100%}
body{
  background:var(--navy);
  color:var(--cream);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  position:relative;
  overflow-x:hidden;
}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px;border-radius:6px}

.skip-link{position:absolute;top:-100%;left:16px;z-index:10000;padding:12px 24px;background:var(--gold);color:var(--navy);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;border-radius:0 0 8px 8px}
.skip-link:focus{top:0}

/* Aurora */
.aurora{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:0.4}
.orb-1{width:500px;height:500px;top:-15%;left:-10%;background:radial-gradient(circle,rgba(var(--gold-rgb),0.45) 0%,transparent 70%)}
.orb-2{width:420px;height:420px;bottom:-10%;right:-5%;background:radial-gradient(circle,rgba(var(--gold-rgb),0.3) 0%,transparent 70%)}
.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px}

main{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:80px 32px 96px;text-align:center}

.eyebrow{
  font-family:'Inter',sans-serif;
  font-size:11px;letter-spacing:0.32em;
  text-transform:uppercase;color:var(--gold);
  font-weight:600;margin-bottom:24px;
  display:flex;align-items:center;justify-content:center;gap:18px;
}
.eyebrow::before,.eyebrow::after{content:'';width:36px;height:1px;background:var(--gold);opacity:0.5}
.eyebrow-pair{white-space:nowrap}

.logo-row{display:flex;justify-content:center;align-items:center;gap:32px;margin-bottom:36px}
.logo-row img{height:clamp(80px,10vw,120px);object-fit:contain;filter:brightness(0) invert(1)}

.title{
  font-family:'Playfair Display',serif;
  font-size:clamp(36px,6vw,60px);
  font-weight:700;
  letter-spacing:-0.02em;
  line-height:1.05;
  margin-bottom:16px;
  text-shadow:0 0 80px rgba(var(--gold-rgb),0.3);
}
.subtitle{
  font-size:clamp(15px,1.6vw,18px);
  color:rgba(var(--cream-rgb),0.7);
  font-style:italic;
  margin-bottom:8px;
  font-family:'Playfair Display',serif;
}
.tagline{
  font-family:'Inter',sans-serif;
  font-size:13px;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--gold);font-weight:500;
}

.divider{width:140px;height:2px;margin:40px auto 56px;border-radius:2px;background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-bright))}

.section{margin-bottom:48px}
.section-label{
  font-family:'Inter',sans-serif;
  font-size:12px;letter-spacing:0.28em;
  text-transform:uppercase;font-weight:700;
  color:var(--cream);
  margin-bottom:20px;
  display:flex;align-items:center;justify-content:center;gap:14px;
}
.section-label::before,.section-label::after{content:'';width:24px;height:1px;background:rgba(var(--cream-rgb),0.2)}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

.card{
  display:flex;flex-direction:column;align-items:flex-start;
  padding:24px 22px;
  background:rgba(var(--cream-rgb),0.03);
  border:1px solid rgba(var(--cream-rgb),0.08);
  border-radius:16px;
  text-decoration:none;
  color:var(--cream);
  position:relative;
  overflow:hidden;
  transition:transform 0.3s ease,border-color 0.3s ease,background 0.3s ease;
  text-align:left;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--gold-bright);transition:background 0.3s ease;
}
@media(hover:hover){
  .card:hover{transform:translateY(-3px);border-color:rgba(var(--gold-rgb),0.4);background:rgba(var(--cream-rgb),0.06)}
}
.card-month{
  font-family:'Playfair Display',serif;
  font-size:22px;font-weight:700;
  letter-spacing:-0.01em;
  margin-bottom:4px;
  color:var(--cream);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-right:36px;
}
.card-meta{
  font-size:12px;
  color:rgba(var(--cream-rgb),0.55);
  font-family:'Inter',sans-serif;
  letter-spacing:0.08em;text-transform:uppercase;
}
.card-arrow{
  position:absolute;top:24px;right:22px;
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:rgba(var(--cream-rgb),0.45);
  transition:color 0.3s ease,transform 0.3s ease;
}
@media(hover:hover){
  .card:hover .card-arrow{color:var(--gold-bright);transform:translateX(2px)}
}
.card-tag{
  display:inline-block;
  padding:3px 10px;border-radius:100px;
  font-family:'Inter',sans-serif;
  font-size:9px;letter-spacing:0.14em;text-transform:uppercase;font-weight:700;
  white-space:nowrap;
}
.card-tag.new{background:rgba(var(--gold-rgb),0.18);color:var(--gold-bright);border:1px solid rgba(var(--gold-rgb),0.4)}

.foot{
  margin-top:64px;padding-top:32px;
  border-top:1px solid rgba(var(--cream-rgb),0.08);
  font-family:'Inter',sans-serif;
  font-size:11px;letter-spacing:0.22em;text-transform:uppercase;
  color:rgba(var(--cream-rgb),0.45);
}
.foot a{color:var(--gold);text-decoration:none;font-weight:600;transition:color 0.3s ease}
@media(hover:hover){.foot a:hover{color:var(--gold-bright)}}

@media(max-width:600px){
  main{padding:64px 20px 80px}
  .logo-row{gap:20px}
  .cards{grid-template-columns:1fr}
  .eyebrow{flex-wrap:wrap;gap:10px;letter-spacing:0.22em}
  .eyebrow::before,.eyebrow::after{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0.01ms!important;animation-duration:0.01ms!important}
}
</style>
</head>
<body>

<a class="skip-link" href="#main-content">Skip to content</a>

<div class="aurora">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>
<div class="grain"></div>

<main id="main-content">
  <p class="eyebrow">Arc Garde <span class="eyebrow-pair">Organic Content</span></p>

  <div class="logo-row">
    <img src="https://ulhrqamsvaohirawndyu.supabase.co/storage/v1/object/public/AG%20-%20Assets/AG%20Arbor%20Wealth%20Strategies/site-logo-hero.png" alt="Arbor Wealth Strategies">
  </div>

  <h1 class="title">KPI Reports</h1>
  <p class="subtitle">Arbor Wealth Strategies</p>
  <p class="tagline">Monthly Performance</p>

  <div class="divider"></div>

  <div class="section">
    <p class="section-label">Monthly</p>
    <div class="cards">
      <a class="card" href="/arborwealth/apr-2026">
        <div class="card-arrow">&rsaquo;</div>
        <p class="card-month">April<span class="card-tag new">Inaugural</span></p>
        <p class="card-meta">2026</p>
      </a>
    </div>
  </div>

  <div class="foot">
    <a href="https://www.arcgarde.com" target="_blank" rel="noopener">Arc Garde</a> &middot; Organic Content Reports
  </div>
</main>

</body>
</html>
